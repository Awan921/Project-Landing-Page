<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Header Section -->
    <div class="header">
        <h2>Awan Restaurant</h2>
        <div class="links">
            <a class="btn" href="#">Home</a>
            <a class="btn" href="#">Menu</a>
            <a class="btn" href="#">Contact</a>
        </div>
    </div>

    <!-- Hero Section -->
    <div class="hero">
        <div class="hero-txt">
            <p class="hero-title">Fresh Food - Bold Flavors</p>
            <p class="hero-subtitle">Delicious meals made fresh every day</p>
            <button class="btn">Sign Up</button>
        </div>

    <!-- Information Section -->
    <div class="info">
        <h2>Information</h2>
        <div class="info-card">

                    <div class="card">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRXU7Mldz1btTXFg0zr4VOIE7k0n3TrdKahqiH6RJEYdg&s=10"
                    alt="Fresh Ingredients">
                <p>Fresh Ingredients</p>
            </div>

                    <div class="card">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSEYPDosiqCBUO4z4V0xlPNN6Bj6ziBZxPwgHlZGMk4Mw&s=10"
                    alt="Fast Delivery">
                <p>Fast Delivery</p>
            </div>

                    <div class="card">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRnq_5liFa5OADbRLwPHKnNgk8xlZE1nBhfqFXjWn538Q&s=10"
                    alt="Quality Guaranteed">
                <p>Quality Guaranteed</p>
            </div>

        </div>
    </div>

    <!-- Quote Section -->
    <div class="quote">
        <h2>Quote</h2>
        <p>Great food brings people together</p>
    </div>

    <!-- Call to Action Section -->
    <div class="cta">
        <div class="cta-box">
            <div class="cta-text">
                <h2>Call To Action</h2>
                <p>Ready to taste something amazing?</p>
            </div>
            <button>Order Now</button>
        </div>
    </div>

    <!-- Footer Section -->
    <div class="footer">
        <p>Copyright © Awan 2026</p>
    </div>


</body>

</html>
